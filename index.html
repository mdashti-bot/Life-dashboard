<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life System">
<meta name="theme-color" content="#0A0E0C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Life System</title>
<style>
  :root{
    --bg:#0A0E0C;
    --card:#121815;
    --card-border:#1E2621;
    --ink:#E9E6DC;
    --ink-dim:#8A9089;
    --gold:#C9A24B;
    --green:#5FA87A;
    --red:#C15C4A;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{
    padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    min-height:100vh;
  }
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
  h1{font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;margin:0;}
  .clock{font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
  .refresh{
    background:none;border:1px solid var(--card-border);color:var(--ink-dim);
    border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--mono);
  }
  .refresh:active{background:var(--card);}

  section{margin-bottom:22px;}
  .section-label{
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);
    margin:0 0 8px 2px;font-weight:600;
  }
  .card{
    background:var(--card);border:1px solid var(--card-border);
    border-radius:14px;padding:16px;
  }

  /* Budget */
  .big-number{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;}
  .big-label{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .budget-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
  .budget-sub{text-align:right;}
  .budget-sub .big-number{font-size:20px;}
  .bar-track{height:6px;background:#1E2621;border-radius:4px;overflow:hidden;margin-top:10px;}
  .bar-fill{height:100%;background:var(--gold);border-radius:4px;}
  .cat-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;padding:7px 0;border-top:1px solid var(--card-border);}
  .cat-row:first-of-type{border-top:none;}
  .cat-name{color:var(--ink);font-family:var(--sans);}
  .cat-amt{color:var(--ink-dim);}
  .cat-amt.over{color:var(--red);}

  /* Tasks */
  .task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--card-border);}
  .task-row:first-of-type{border-top:none;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:6px;flex-shrink:0;}
  .check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--card-border);margin-top:2px;flex-shrink:0;transition:background .15s,border-color .15s;}
  .check:active{background:var(--gold);border-color:var(--gold);}
  .task-title{font-size:14px;line-height:1.4;}
  .task-meta{font-size:11px;color:var(--ink-dim);font-family:var(--mono);margin-top:2px;}
  .empty{color:var(--ink-dim);font-size:13px;padding:6px 0;}
  .log-row{display:flex;gap:8px;margin-bottom:14px;}
  .log-row input{
    flex:1;background:#0E1412;border:1px solid var(--card-border);border-radius:8px;
    color:var(--ink);font-family:var(--mono);font-size:14px;padding:9px 10px;min-width:0;
  }
  .log-row input::placeholder{color:var(--ink-dim);}
  .log-btn{
    background:var(--gold);color:#0A0E0C;border:none;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:600;font-family:var(--sans);
  }
  .log-btn:active{opacity:0.8;}

  /* Trading */
  .pnl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .pnl-value{font-family:var(--mono);font-size:28px;font-weight:600;}
  .pnl-value.pos{color:var(--green);}
  .pnl-value.neg{color:var(--red);}
  .trade-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:8px 0;border-top:1px solid var(--card-border);}
  .trade-row:first-of-type{border-top:none;}
  .side-buy{color:var(--green);}
  .side-sell{color:var(--red);}

  .stamp{text-align:center;color:var(--ink-dim);font-family:var(--mono);font-size:10px;margin-top:24px;letter-spacing:0.08em;}
  .err{color:var(--red);font-size:13px;text-align:center;padding:40px 20px;}
</style>
</head>
<body>

<header>
  <h1>Life System</h1>
  <button class="refresh" onclick="load()">↻ refresh</button>
</header>

<div id="app">
  <div class="err" style="color:var(--ink-dim)">Loading…</div>
</div>

<div class="stamp" id="stamp"></div>

<script>
const WEBHOOK = "https://hook.us2.make.com/m7mi6siquksmx34xcyfbril3k1kxt4r8";
const ACTIONS_WEBHOOK = "https://hook.us2.make.com/q3y8gbs3lqmnp6qgxmlnquxni4qbjsoc";

// Fix double-encoded UTF-8 (Arabic text coming through as mojibake)
function fixEncoding(str){
  try {
    return decodeURIComponent(escape(str));
  } catch(e){ return str; }
}

function fmt(n){
  const num = parseFloat(n) || 0;
  return num.toFixed(3).replace(/\.?0+$/,'') || '0';
}

function rowsToObjects(values){
  if(!values || values.length < 2) return [];
  const headers = values[0];
  return values.slice(1).filter(r => r.some(c => c !== "")).map((r, i) => {
    const o = {};
    headers.forEach((h,idx) => o[h] = fixEncoding(r[idx] || ""));
    o._row = i + 2; // sheet row number (row 1 = header)
    return o;
  });
}

let busy = false;

async function markDone(pageId, btn){
  if(busy) return;
  busy = true;
  if(btn) btn.textContent = '…';
  try {
    await fetch(ACTIONS_WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'markTaskDone', pageId: pageId})
    });
    await load();
  } catch(e){
    if(btn) btn.textContent = '!';
  } finally {
    busy = false;
  }
}

async function logWeight(){
  if(busy) return;
  const input = document.getElementById('weightInput');
  const val = parseFloat(input.value);
  if(!val) return;
  busy = true;
  const btn = document.getElementById('logWeightBtn');
  const original = btn.textContent;
  btn.textContent = '…';
  try {
    await fetch(ACTIONS_WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'logWeight', weight: val})
    });
    input.value = '';
    await load();
  } catch(e){
    btn.textContent = '!';
  } finally {
    busy = false;
    if(btn.textContent === '…') btn.textContent = original;
  }
}

async function load(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="err" style="color:var(--ink-dim)">Loading…</div>';
  try {
    const res = await fetch(WEBHOOK + '?t=' + Date.now());
    const data = await res.json();
    render(data);
    document.getElementById('stamp').textContent = 'updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  } catch(e){
    app.innerHTML = '<div class="err">Could not load data.<br>' + e.message + '</div>';
  }
}

function render(data){
  const ranges = {};
  (data.valueRanges || []).forEach(vr => {
    ranges[vr.range] = vr.values || [];
  });

  const tradingRaw = ranges['Trading!A1:I15'] || [];
  const weightRaw = ranges['wight!A1:D30'] || [];
  const metricsRaw = ranges['Metrics!A1:B13'] || [];

  const tasks = (data.tasks || []).map(page => {
    const p = page.properties || {};
    const titleArr = (p.Task && p.Task.title) || [];
    return {
      id: page.id,
      title: titleArr.map(t => t.plain_text).join('') || 'Untitled',
      type: p.Type && p.Type.select ? p.Type.select.name : '',
      due: p.Due && p.Due.date ? p.Due.date.start : '',
      priority: p.Priority && p.Priority.select ? p.Priority.select.name : ''
    };
  });

  // Weekly snapshot (live from Notion)
  const weekPage = (data.weekly || [])[0];
  const weekP = weekPage ? weekPage.properties : {};
  const weeklyLimit = weekP['Weekly limit KWD'] && weekP['Weekly limit KWD'].formula ? weekP['Weekly limit KWD'].formula.number : 30;
  const weeklySpent = weekP['Weekly spent KWD'] ? weekP['Weekly spent KWD'].number : 0;
  const weeklyRemaining = weekP['Weekly remaining KWD'] && weekP['Weekly remaining KWD'].formula ? weekP['Weekly remaining KWD'].formula.number : (weeklyLimit - weeklySpent);
  const weeklyPct = weeklyLimit > 0 ? Math.min(100, (weeklySpent / weeklyLimit) * 100) : 0;

  // Monthly / cycle snapshot (live from Notion)
  const monthPage = (data.monthly || [])[0];
  const monthP = monthPage ? monthPage.properties : {};
  const cycleLabel = monthP.Month && monthP.Month.title ? monthP.Month.title.map(t => t.plain_text).join('') : '';
  const cycleEnd = cycleLabel.includes(' to ') ? cycleLabel.split(' to ')[1] : '—';
  const totalIncome = monthP['Total income KWD'] ? monthP['Total income KWD'].number : 0;
  const totalSpent = monthP['Total spent KWD'] ? monthP['Total spent KWD'].number : 0;
  const cycleNet = totalIncome - totalSpent;

  // Categories: build id -> {name, limit} map
  const catMap = {};
  (data.categories || []).forEach(c => {
    const cp = c.properties || {};
    const titleArr = (cp.Name && cp.Name.title) || [];
    catMap[c.id] = {
      name: titleArr.map(t => t.plain_text).join('') || 'Unnamed',
      limit: cp['Cycle limit KWD'] ? cp['Cycle limit KWD'].number : null,
      kind: cp.Kind && cp.Kind.select ? cp.Kind.select.name : ''
    };
  });

  // Current-cycle expense transactions, grouped by category
  const catTotals = {};
  (data.transactions || []).forEach(tx => {
    const tp = tx.properties || {};
    const amt = tp['Amount KWD'] ? tp['Amount KWD'].number : 0;
    const catRel = (tp.Category && tp.Category.relation) || [];
    const catId = catRel[0] ? catRel[0].id : null;
    const key = catId && catMap[catId] ? catMap[catId].name : 'Uncategorized';
    catTotals[key] = (catTotals[key] || 0) + amt;
  });
  const cats = Object.keys(catTotals).sort((a,b) => catTotals[b] - catTotals[a]).map(name => ({name, total: catTotals[name]}));

  const trades = rowsToObjects(tradingRaw);

  const weights = rowsToObjects(weightRaw).filter(w => w['Date']);
  const latestWeight = weights[weights.length - 1];
  const prevWeight = weights[weights.length - 2];
  const weightDelta = latestWeight && prevWeight
    ? (parseFloat(latestWeight['Weight']) - parseFloat(prevWeight['Weight']))
    : null;

  const metricsRows = (metricsRaw || []).filter(r => r[0] && r[1] !== undefined && r[1] !== '');
  const metrics = {};
  metricsRows.forEach(r => { metrics[r[0]] = r[1]; });

  let html = '';

  // BUDGET
  html += `<section>
    <div class="section-label">Budget · cycle ends ${cycleEnd}</div>
    <div class="card">
      <div class="budget-row">
        <div>
          <div class="big-number">${fmt(cycleNet)}</div>
          <div class="big-label">KWD net this cycle</div>
        </div>
        <div class="budget-sub">
          <div class="big-number">${fmt(weeklyRemaining)}</div>
          <div class="big-label">left this week</div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${weeklyPct}%"></div></div>
      ${cats.map(c => `<div class="cat-row"><span class="cat-name">${c.name}</span><span class="cat-amt">${fmt(c.total)} KWD</span></div>`).join('')}
    </div>
  </section>`;

  // TASKS
  html += `<section>
    <div class="section-label">Open Tasks (${tasks.length})</div>
    <div class="card">
      ${tasks.length === 0 ? "<div class=\"empty\">Nothing open — you're clear.</div>" :
        tasks.map(t => `<div class="task-row">
          <div class="check" onclick="markDone('${t.id}', this)"></div>
          <div>
            <div class="task-title">${t.title}</div>
            <div class="task-meta">${t.type || ''}${t.due ? ' · due ' + t.due : ''}</div>
          </div>
        </div>`).join('')}
    </div>
  </section>`;

  // TRADING
  let netPnl = 0;
  const closedTrades = trades.filter(t => t['Order ID']);
  html += `<section>
    <div class="section-label">Trading</div>
    <div class="card">
      <div class="pnl-row">
        <div>
          <div class="big-label">recent orders</div>
        </div>
      </div>
      ${trades.length === 0 ? '<div class="empty">No trades logged.</div>' :
        trades.map(t => `<div class="trade-row">
          <span>${t['Date/Time'] ? t['Date/Time'].split(' ')[0] : ''} <span class="${t['Side']==='Buy'?'side-buy':'side-sell'}">${t['Side'] || ''}</span></span>
          <span>${t['Symbol'] || ''}</span>
          <span>${fmt(t['Avg Fill Price'])}</span>
        </div>`).join('')}
    </div>
  </section>`;

  // TRADING PERFORMANCE
  const netPnlVal = parseFloat(metrics['Net PnL']) || 0;
  html += `<section>
    <div class="section-label">Trading Performance</div>
    <div class="card">
      <div class="pnl-row">
        <div>
          <div class="big-number ${netPnlVal >= 0 ? 'pos' : 'neg'}" style="color:${netPnlVal >= 0 ? 'var(--green)' : 'var(--red)'}">${metrics['Net PnL'] || '0'}</div>
          <div class="big-label">net P&L</div>
        </div>
        <div class="budget-sub">
          <div class="big-number">${metrics['Win rate'] || '—'}</div>
          <div class="big-label">win rate</div>
        </div>
      </div>
      <div class="cat-row"><span class="cat-name">Total trades</span><span class="cat-amt">${metrics['Total trades'] || '0'}</span></div>
      <div class="cat-row"><span class="cat-name">Wins / Losses</span><span class="cat-amt">${metrics['Wins'] || '0'} / ${metrics['Losses'] || '0'}</span></div>
      <div class="cat-row"><span class="cat-name">Avg win / loss</span><span class="cat-amt">${metrics['Avg win'] || '0'} / ${metrics['Avg loss'] || '0'}</span></div>
      <div class="cat-row"><span class="cat-name">Profit factor</span><span class="cat-amt">${metrics['Profit factor'] || '0'}</span></div>
    </div>
  </section>`;

  // WEIGHT
  html += `<section>
    <div class="section-label">Weight</div>
    <div class="card">
      <div class="log-row">
        <input type="number" step="0.1" inputmode="decimal" id="weightInput" placeholder="log today's weight">
        <button id="logWeightBtn" class="log-btn" onclick="logWeight()">Log</button>
      </div>
      ${!latestWeight ? '<div class="empty">No entries logged.</div>' : `
      <div class="budget-row">
        <div>
          <div class="big-number">${latestWeight['Weight']}</div>
          <div class="big-label">${weightDelta !== null ? (weightDelta > 0 ? '+' : '') + weightDelta.toFixed(1) + ' vs prev' : latestWeight['Date']}</div>
        </div>
        <div class="budget-sub">
          <div class="big-number">${latestWeight['BMI'] || '—'}</div>
          <div class="big-label">BMI · ${latestWeight['Body Fat Percentage'] || latestWeight['BMI'] ? '' : ''}body fat ${latestWeight['Body Fat Percentage'] || '—'}</div>
        </div>
      </div>
      ${weights.slice(-7).reverse().map(w => `<div class="cat-row"><span class="cat-name">${w['Date']}</span><span class="cat-amt">${w['Weight']}</span></div>`).join('')}
      `}
    </div>
  </section>`;

  document.getElementById('app').innerHTML = html;
}

load();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load();
});
</script>
</body>
</html>
